<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Thruplane mark</title>
  <desc id="desc">Three traffic paths crossing a tilted control plane, with the active route highlighted.</desc>
  <defs>
    <linearGradient id="route" x1="9" y1="32" x2="55" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D8FF"/>
      <stop offset="1" stop-color="#2EE6A6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#070B12"/>
  <path d="M24 10 48 22 40 54 16 42Z" fill="#0F1B27" stroke="#35D8FF" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M9 21H21M44.5 21H55" fill="none" stroke="#52677A" stroke-width="3" stroke-linecap="round"/>
  <path d="M9 43H18.5M42.5 43H55" fill="none" stroke="#52677A" stroke-width="3" stroke-linecap="round"/>
  <path d="M9 32H55" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="9" cy="32" r="2.5" fill="#35D8FF"/>
  <circle cx="55" cy="32" r="2.5" fill="#2EE6A6"/>
</svg>
