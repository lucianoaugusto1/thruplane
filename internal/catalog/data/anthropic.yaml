schema_version: 1
provider:
  id: anthropic
  name: Anthropic
  updated_at: "2026-09-19"
  sources:
    - url: https://platform.claude.com/docs/en/models/overview
      title: Claude models overview
    - url: https://platform.claude.com/docs/en/about-claude/pricing
      title: Claude API pricing and prompt caching
    - url: https://platform.claude.com/docs/en/build-with-claude/vision
      title: Claude vision input
    - url: https://platform.claude.com/docs/en/build-with-claude/pdf-support
      title: Claude PDF support
models:
  - id: claude-fable-5-1
    name: Claude Fable 5.1
    family: claude-fable
    status: active
    knowledge_cutoff: "2026-06"
    capabilities: &claude_capabilities
      operations: [chat]
      input_modalities: [text, image, document]
      output_modalities: [text]
      streaming: true
      structured_outputs: true
      prompt_caching: true
      reasoning: true
      tools: {function_calling: true, parallel_calls: true, strict_schema: true}
    limits: {context_tokens: 1000000, max_output_tokens: 128000}
    pricing:
      currency: USD
      rates:
        - {kind: input, modality: text, unit: million_tokens, price: 10}
        - {kind: cache_write_5m, modality: text, unit: million_tokens, price: 12.5}
        - {kind: cache_write_1h, modality: text, unit: million_tokens, price: 20}
        - {kind: cache_read, modality: text, unit: million_tokens, price: 1}
        - {kind: output, modality: text, unit: million_tokens, price: 50}
    performance: {latency_class: slower, notes: "Anthropic publishes only a comparative latency class."}

