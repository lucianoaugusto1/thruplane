schema_version: 1
provider:
  id: xai
  name: xAI
  updated_at: "2026-09-19"
  sources:
    - url: https://docs.x.ai/developers/models
      title: xAI models
    - url: https://docs.x.ai/developers/pricing
      title: xAI API pricing
models:
  - id: grok-4.6
    aliases: [grok-4.6-latest]
    name: Grok 4.6
    family: grok-4
    status: active
    knowledge_cutoff: "2026-02-01"
    capabilities: &grok_capabilities
      operations: [chat, responses]
      input_modalities: [text, image, document]
      output_modalities: [text]
      streaming: true
      structured_outputs: true
      prompt_caching: true
      reasoning: true
      tools: {function_calling: true, parallel_calls: true, strict_schema: true}
    limits: {context_tokens: 500000, max_image_bytes: 20971520}
    pricing:
      currency: USD
      rates:
        - {kind: input, modality: text, unit: million_tokens, price: 2}
        - {kind: cache_read, modality: text, unit: million_tokens, price: 0.5}
        - {kind: output, modality: text, unit: million_tokens, price: 6}
        - {kind: input, modality: text, unit: million_tokens, price: 4, condition: "input_tokens >= 200000"}
        - {kind: cache_read, modality: text, unit: million_tokens, price: 1, condition: "input_tokens >= 200000"}
        - {kind: output, modality: text, unit: million_tokens, price: 12, condition: "input_tokens >= 200000"}
    performance: {latency_class: fast, notes: "xAI doesn't publish comparable TTFT or output TPS."}

  - id: grok-4.5
    aliases: [grok-4.5-latest]
    name: Grok 4.5
    family: grok-4
    status: active
    capabilities: *grok_capabilities
    limits: {context_tokens: 500000, max_image_bytes: 20971520}
    pricing:
      currency: USD
      rates:
        - {kind: input, modality: text, unit: million_tokens, price: 2}
        - {kind: cache_read, modality: text, unit: million_tokens, price: 0.3}
        - {kind: output, modality: text, unit: million_tokens, price: 6}
        - {kind: input, modality: text, unit: million_tokens, price: 4, condition: "input_tokens >= 200000"}
        - {kind: cache_read, modality: text, unit: million_tokens, price: 0.6, condition: "input_tokens >= 200000"}
        - {kind: output, modality: text, unit: million_tokens, price: 12, condition: "input_tokens >= 200000"}
    performance: {latency_class: fast, notes: "xAI doesn't publish comparable TTFT or output TPS."}

  - id: grok-4.3
    aliases: [grok-4.3-latest]
    name: Grok 4.3
    family: grok-4
    status: active
    capabilities: *grok_capabilities
    limits: {context_tokens: 1000000, max_image_bytes: 20971520}
    pricing:
      currency: USD
      rates:
        - {kind: input, modality: text, unit: million_tokens, price: 1.25}
        - {kind: cache_read, modality: text, unit: million_tokens, price: 0.2}
        - {kind: output, modality: text, unit: million_tokens, price: 2.5}
        - {kind: input, modality: text, unit: million_tokens, price: 2.5, condition: "input_tokens >= 200000"}
        - {kind: cache_read, modality: text, unit: million_tokens, price: 0.4, condition: "input_tokens >= 200000"}
        - {kind: output, modality: text, unit: million_tokens, price: 5, condition: "input_tokens >= 200000"}
    performance: {latency_class: fast, notes: "xAI doesn't publish comparable TTFT or output TPS."}
