server:
  address: ":8080"
  api_key: "${NEXOROUTE_API_KEY}"
  max_body_bytes: 1048576
  read_header_timeout: 5s
  shutdown_timeout: 10s

catalog:
  # allow preserves passthrough for private or newly released model IDs.
  # Use reject to require every target to match an embedded catalog entry.
  unknown_models: allow

providers:
  openai:
    type: openai
    base_url: https://api.openai.com
    api_key: "${OPENAI_API_KEY}"
  ollama:
    type: ollama
    base_url: http://localhost:11434

  # See docs/providers.md for Anthropic, Gemini, Vertex AI, Bedrock,
  # Azure OpenAI, xAI/Grok, custom OpenAI-compatible APIs, and NexoRoute
  # Inference configuration.

models:
  fast:
    targets:
      - provider: openai
        model: gpt-4o-mini
        # For a deployment name, set catalog_model to the underlying model ID.
        # catalog_model: gpt-4o-mini
      - provider: ollama
        model: llama3.2:latest
  local:
    targets:
      - provider: ollama
        model: llama3.2:latest

routing:
  retries: 1
  response_header_timeout: 30s
